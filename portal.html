<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrightPath HR System</title>
<style>
  :root{--navy:#0b2545;--navy-2:#13315c;--blue:#1f5fd1;--gray:#f4f6f9;--line:#dde3ec;--text:#1b2638;--muted:#53607a}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--gray);color:var(--text);line-height:1.55}
  header{background:var(--navy);color:#fff;padding:1rem 1.25rem;font-weight:700;font-size:1.2rem}
  main{max-width:760px;margin:0 auto;padding:2.5rem 1.25rem}
  h1{color:var(--navy);font-size:clamp(1.8rem,4.5vw,2.5rem);margin:0 0 .6rem;line-height:1.2}
  p.welcome{color:var(--muted);font-size:1.1rem;margin:0 0 2rem;max-width:60ch}
  .buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
  .card{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:1.4rem;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s}
  .card:hover{border-color:var(--blue);box-shadow:0 6px 18px rgba(11,37,69,.09)}
  .card:focus-visible{outline:3px solid #7fb0ff;outline-offset:2px}
  .card h2{margin:0 0 .4rem;color:var(--navy);font-size:1.25rem}
  .card p{margin:0;color:var(--muted)}
</style>
</head>
<body>
<header>BrightPath</header>
<main>
  <h1>BrightPath HR System</h1>
  <p class="welcome">Welcome. Choose a service to submit a leave request or to ask the HR Assistant about company policies and benefits.</p>
  <div class="buttons">
    <a class="card" id="leave-link" href="#"><h2>Leave Request</h2><p>Submit a leave request to HR.</p></a>
    <a class="card" id="chatbot-link" href="#"><h2>HR Chatbot</h2><p>Ask questions about the Employee Handbook.</p></a>
  </div>
</main>
<script>
  /* ============================================================
     EDIT THESE TWO URLS
     ============================================================ */
  const LEAVE_REQUEST_URL = "https://forms.gle/3GGSTRxnk2wzBNqg6"; // your leave request form
  const HR_CHATBOT_URL = "chatbot.html"; // keep this if chatbot.html is in the same GitHub repo; otherwise paste the full chatbot URL
  /* ============================================================ */

  document.getElementById("leave-link").href = LEAVE_REQUEST_URL;
  document.getElementById("chatbot-link").href = HR_CHATBOT_URL;
</script>
</body>
</html>
