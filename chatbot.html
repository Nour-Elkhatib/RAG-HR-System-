<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrightPath HR Assistant</title>
<style>
  :root{--navy:#0b2545;--navy-2:#13315c;--blue:#1f5fd1;--gray:#f4f6f9;--line:#dde3ec;--text:#1b2638;--muted:#53607a;--danger:#a61b1b}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;flex-direction:column;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--gray);color:var(--text);line-height:1.5}
  header{background:var(--navy);color:#fff;padding:1rem 1.25rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
  header strong{font-size:1.2rem}
  header a{color:#cfe0ff;text-decoration:none}
  header a:hover{color:#fff;text-decoration:underline}
  main{flex:1;min-height:0;width:100%;max-width:820px;margin:0 auto;padding:1rem;display:flex;flex-direction:column;gap:.8rem}
  h1{margin:0;color:var(--navy);font-size:1.6rem}
  .intro{margin:0;color:var(--muted)}
  #chat{flex:1;min-height:0;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:1rem;display:flex;flex-direction:column;gap:.8rem}
  .msg{max-width:85%;padding:.7rem 1rem;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
  .user{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
  .bot{align-self:flex-start;background:var(--gray);border:1px solid var(--line);border-bottom-left-radius:4px}
  .loading{align-self:flex-start;color:var(--muted);font-style:italic}
  .error{align-self:flex-start;background:#fdecec;border:1px solid #f2b8b8;color:var(--danger);border-radius:14px;padding:.7rem 1rem}
  form{display:flex;gap:.6rem}
  input[type=text]{flex:1;font:inherit;padding:.7rem .9rem;border:1px solid var(--line);border-radius:10px;min-width:0}
  button{font:inherit;font-weight:600;padding:.7rem 1.2rem;border-radius:10px;border:1px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer}
  button:hover:not(:disabled){background:#194fad}
  button.secondary{background:#fff;color:var(--navy);border-color:var(--line)}
  button.secondary:hover:not(:disabled){background:#e8f0fe;border-color:var(--blue)}
  button:disabled,input:disabled{opacity:.55;cursor:not-allowed}
  button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #7fb0ff;outline-offset:2px}
  .actions{display:flex;justify-content:flex-end}
  @media (max-width:520px){.msg{max-width:94%}}
</style>
</head>
<body>
<header>
  <strong>BrightPath</strong>
  <a href="#" id="portal-link">Back to HR portal</a>
</header>
<main>
  <h1>BrightPath HR Assistant</h1>
  <p class="intro">Ask a question about company policies, leave, benefits and other topics in the Employee Handbook.</p>
  <div id="chat" role="log" aria-live="polite"></div>
  <form id="form" autocomplete="off">
    <input type="text" id="input" placeholder="Type your question..." aria-label="Your question" maxlength="1000" required>
    <button type="submit" id="send">Send</button>
  </form>
  <div class="actions"><button type="button" class="secondary" id="clear">Clear Chat</button></div>
</main>
<script>
  /* ============================================================
     EDIT THESE SETTINGS
     ============================================================ */
  // Paste your n8n PRODUCTION webhook URL (the workflow must be Active).
  const CHATBOT_WEBHOOK_URL = "https://nourelkhatib7.app.n8n.cloud/webhook-test/3e2df53c-c67f-4ca2-a644-1dfbed9662ff";

  // Link back to the portal page.
  const PORTAL_URL = "portal.html";

  // The JSON field name n8n expects for the question, e.g. {"question": "..."}.
  // Change it if your workflow expects something else (for example "chatInput").
  const REQUEST_FIELD = "question";

  // How n8n's reply is read. n8n returns JSON like {"Response": "..."}.
  // "answer" and "output" are also accepted as fallbacks.
  function getAnswer(data) {
    if (Array.isArray(data)) data = data[0];
    if (!data) return null;
    const text = data.Response ?? data.answer ?? data.output;
    return typeof text === "string" && text.trim() ? text.trim() : null;
  }
  /* ============================================================ */

  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const clearBtn = document.getElementById("clear");
  document.getElementById("portal-link").href = PORTAL_URL;
  let busy = false;

  function add(cls, text) {
    const div = document.createElement("div");
    div.className = cls === "error" || cls === "loading" ? cls : "msg " + cls;
    div.textContent = text; // plain text, never HTML
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function setBusy(state) {
    busy = state;
    input.disabled = state;
    sendBtn.disabled = state;
    if (!state) input.focus();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question || busy) return;
    add("user", question);
    input.value = "";

    if (CHATBOT_WEBHOOK_URL.startsWith("YOUR_")) {
      add("error", "The chatbot is not connected yet. Add your n8n webhook URL in chatbot.html.");
      return;
    }

    setBusy(true);
    const loading = add("loading", "Thinking...");
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 60000);
    try {
      const res = await fetch(CHATBOT_WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ [REQUEST_FIELD]: question }),
        signal: controller.signal
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const answer = getAnswer(JSON.parse(await res.text()));
      loading.remove();
      if (answer) add("bot", answer);
      else add("error", "The HR Assistant did not return an answer. Please try again or contact HR.");
    } catch (err) {
      console.error("Chatbot error:", err); // details for you, in the browser console (F12)
      loading.remove();
      add("error", err.name === "AbortError"
        ? "The HR Assistant took too long to respond. Please try again."
        : "The HR Assistant is unavailable right now. Please try again in a few minutes.");
    } finally {
      clearTimeout(timer);
      setBusy(false);
    }
  });

  clearBtn.addEventListener("click", () => { chat.replaceChildren(); input.focus(); });
</script>
</body>
</html>
