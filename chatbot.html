<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrightPath HR Assistant</title>
    <style>
      :root {
        --soot: #2d3536;
        --moss: #697c70;
        --euc: #98aa9d;
        --mist: #b3c9d6;
        --plaster: #f2efe2;
        --line: color-mix(in srgb, var(--euc) 45%, var(--plaster));
        --muted: color-mix(in srgb, var(--soot) 78%, var(--plaster));
        --danger: #a61b1b;
        --serif:
          "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Georgia,
          serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
        background: var(--plaster);
        color: var(--soot);
        line-height: 1.5;
      }
      header {
        background: var(--soot);
        color: var(--plaster);
        padding: 0.85rem 1.25rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }
      header strong {
        font-family: var(--serif);
        font-size: 1.7rem;
        font-weight: 600;
        line-height: 1;
      }
      header strong span {
        color: var(--euc);
        font-style: italic;
      }
      header a {
        color: var(--mist);
        text-decoration: none;
        font-weight: 500;
      }
      header a:hover {
        color: #fff;
        text-decoration: underline;
      }
      main {
        flex: 1;
        min-height: 0;
        width: 100%;
        max-width: 820px;
        margin: 0 auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }
      .id {
        display: flex;
        align-items: center;
        gap: 0.8rem;
      }
      .avatar {
        width: 2.8rem;
        height: 2.8rem;
        border-radius: 50%;
        background: var(--soot);
        color: var(--euc);
        display: grid;
        place-items: center;
        font-weight: 800;
        flex: none;
      }
      h1 {
        margin: 0;
        font-family: var(--serif);
        color: var(--soot);
        font-size: 1.8rem;
        font-weight: 600;
        line-height: 1.1;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .status::before {
        content: "";
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: var(--moss);
      }
      .intro {
        margin: 0;
        color: var(--muted);
      }
      #chat {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }
      .msg {
        max-width: 85%;
        padding: 0.7rem 1rem;
        border-radius: 18px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .user {
        align-self: flex-end;
        background: var(--soot);
        color: var(--plaster);
        border-bottom-right-radius: 4px;
      }
      .bot {
        align-self: flex-start;
        background: var(--mist);
        color: var(--soot);
        border-bottom-left-radius: 4px;
      }
      .loading {
        align-self: flex-start;
        background: var(--mist);
        border-radius: 18px;
        border-bottom-left-radius: 4px;
        padding: 0.7rem 1rem;
        color: var(--soot);
        font-style: italic;
      }
      .loading::after {
        content: "";
        display: inline-block;
        width: 1.4em;
        text-align: left;
        animation: dots 1.2s steps(4, end) infinite;
      }
      @keyframes dots {
        0% {
          content: "";
        }
        25% {
          content: ".";
        }
        50% {
          content: "..";
        }
        75%,
        100% {
          content: "...";
        }
      }
      .error {
        align-self: flex-start;
        background: #fdecec;
        border: 1px solid #f2b8b8;
        color: var(--danger);
        border-radius: 14px;
        padding: 0.7rem 1rem;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      form {
        display: flex;
        gap: 0.6rem;
      }
      input[type="text"] {
        flex: 1;
        font: inherit;
        padding: 0.8rem 1.1rem;
        border: 1px solid var(--euc);
        border-radius: 999px;
        min-width: 0;
        background: #fff;
        color: var(--soot);
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 0.7rem 1.4rem;
        border-radius: 999px;
        border: 1px solid var(--euc);
        background: var(--euc);
        color: var(--soot);
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--mist);
        border-color: var(--mist);
      }
      button.secondary,
      button.chip {
        background: #fff;
        color: var(--soot);
        border-color: var(--euc);
      }
      button.chip {
        font-size: 0.92rem;
        font-weight: 500;
        padding: 0.45rem 0.9rem;
      }
      button.secondary:hover:not(:disabled),
      button.chip:hover:not(:disabled) {
        background: var(--mist);
        border-color: var(--moss);
      }
      button:disabled,
      input:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      button:focus-visible,
      input:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--moss);
        outline-offset: 2px;
      }
      header a:focus-visible {
        outline-color: var(--mist);
      }
      .actions {
        display: flex;
        justify-content: flex-end;
      }
      @media (prefers-reduced-motion: reduce) {
        .loading::after {
          animation: none;
          content: "...";
        }
        #chat {
          scroll-behavior: auto;
        }
      }
      @media (max-width: 520px) {
        .msg {
          max-width: 94%;
        }
        main {
          padding: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Bright<span>Path</span></strong>
      <a href="#" id="portal-link">Back to HR portal</a>
    </header>
    <main>
      <div class="id">
        <div class="avatar" aria-hidden="true">HR</div>
        <div>
          <h1>BrightPath HR Assistant</h1>
          <div class="status">Ready to help</div>
        </div>
      </div>
      <p class="intro">
        Ask a question about company policies, leave, benefits and other topics
        in the Employee Handbook.
      </p>
      <div id="chat" role="log" aria-live="polite"></div>
      <div class="chips" id="chips" aria-label="Suggested questions">
        <button type="button" class="chip">How do I request leave?</button>
        <button type="button" class="chip">
          What are the company's leave policies?
        </button>
        <button type="button" class="chip">How can I refer a candidate?</button>
      </div>
      <form id="form" autocomplete="off">
        <input
          type="text"
          id="input"
          placeholder="Type your question..."
          aria-label="Your question"
          maxlength="1000"
          required
        />
        <button type="submit" id="send">Send</button>
      </form>
      <div class="actions">
        <button type="button" class="secondary" id="clear">Clear Chat</button>
      </div>
    </main>
    <script>
      /* ============================================================
     EDIT THESE SETTINGS
     ============================================================ */
      // Paste your n8n PRODUCTION webhook URL (the workflow must be Active).
      const CHATBOT_WEBHOOK_URL =
        "https://nourelkhatib7.app.n8n.cloud/webhook/3e2df53c-c67f-4ca2-a644-1dfbed9662ff";

      // Link back to the portal page.
      const PORTAL_URL = "portal_fixed.html";
      // The JSON field name n8n expects for the question, e.g. {"question": "..."}.
      // Change it if your workflow expects something else (for example "chatInput").
      const REQUEST_FIELD = "question";

      // How n8n's reply is read. n8n returns JSON like {"Response": "..."}.
      // "answer" and "output" are also accepted as fallbacks.
      function getAnswer(data) {
        if (Array.isArray(data)) data = data[0];
        if (!data) return null;
        const text = data.Response ?? data.answer ?? data.output;
        return typeof text === "string" && text.trim() ? text.trim() : null;
      }
      /* ============================================================ */

      const chat = document.getElementById("chat");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const clearBtn = document.getElementById("clear");
      document.getElementById("portal-link").href = PORTAL_URL;
      let busy = false;

      function add(cls, text) {
        const div = document.createElement("div");
        div.className =
          cls === "error" || cls === "loading" ? cls : "msg " + cls;
        div.textContent = text; // plain text, never HTML
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
      }

      function setBusy(state) {
        busy = state;
        input.disabled = state;
        sendBtn.disabled = state;
        document.querySelectorAll(".chip").forEach((c) => (c.disabled = state));
        if (!state) input.focus();
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const question = input.value.trim();
        if (!question || busy) return;
        add("user", question);
        input.value = "";

        if (CHATBOT_WEBHOOK_URL.startsWith("YOUR_")) {
          add(
            "error",
            "The chatbot is not connected yet. Add your n8n webhook URL in chatbot.html.",
          );
          return;
        }

        setBusy(true);
        const loading = add("loading", "Thinking");
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 60000);
        try {
          const res = await fetch(CHATBOT_WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ [REQUEST_FIELD]: question }),
            signal: controller.signal,
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const answer = getAnswer(JSON.parse(await res.text()));
          loading.remove();
          if (answer) add("bot", answer);
          else
            add(
              "error",
              "The HR Assistant did not return an answer. Please try again or contact HR.",
            );
        } catch (err) {
          console.error("Chatbot error:", err); // details for you, in the browser console (F12)
          loading.remove();
          add(
            "error",
            err.name === "AbortError"
              ? "The HR Assistant took too long to respond. Please try again."
              : "The HR Assistant is unavailable right now. Please try again in a few minutes.",
          );
        } finally {
          clearTimeout(timer);
          setBusy(false);
        }
      });

      clearBtn.addEventListener("click", () => {
        chat.replaceChildren();
        input.focus();
      });

      // Suggested questions: fill the input and submit through the existing handler.
      document.getElementById("chips").addEventListener("click", (e) => {
        const chip = e.target.closest(".chip");
        if (!chip || busy) return;
        input.value = chip.textContent;
        form.requestSubmit();
      });
    </script>
  </body>
</html>
